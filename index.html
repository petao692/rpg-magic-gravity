
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Gravity - RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚔ MAGIC GRAVITY ⚔</h1>
        <p>Conheça os personagens deste universo mágico</p>
    </header>

    <main class="container">

        <input
            type="text"
            id="busca"
            placeholder="Digite o nome do personagem..."
        >

        <div class="personagem">
            <img id="imagem" src="" alt="Personagem">

            <h2 id="nome">Nome do personagem</h2>

            <p id="descricao">Descrição do personagem</p>
        </div>

        <div class="botoes">
            <button id="prev">◀ Anterior</button>
            <button id="next">Próximo ▶</button>
        </div>

        <p id="contador"></p>

    </main>

    <footer>
        <p>Magic Gravity RPG - Um mundo de aventuras!</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
